<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Redesign — Sunollo · Elaine Bayhon</title>

<!-- The shared sheet, for the fonts, the colour and the type scale. Its own
     url()s resolve against the stylesheet rather than this file, so the fonts
     and the logo still find their way from here. app.js is deliberately not
     loaded: it drives a hero, a rail and a carousel, none of which exist on
     this page. -->
<link rel="stylesheet" href="../../styles.css">

<!-- TEMPORARY. A stub so the card on the homepage has somewhere real to go.
     The case study replaces all of this; nothing here is a layout decision. -->
<style>
  .stub {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: var(--margin);
    max-width: 560px;
    margin: 0 auto;
  }
  .stub__client {
    margin: 0;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.3;
    letter-spacing: -0.28px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stub__title {
    margin: 0;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.3;
    letter-spacing: -0.64px;
    color: var(--ink-strong);
  }
  .stub__note {
    margin: 0 0 20px;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.16px;
    color: var(--ink);
  }
  .stub__back {
    font-weight: 500;
    font-size: 14px;
    line-height: 1.3;
    letter-spacing: -0.28px;
    color: var(--ink-strong);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-strong);
    padding-bottom: 2px;
  }
</style>
</head>

<body>
  <main class="stub">
    <p class="stub__client">Sunollo</p>
    <h1 class="stub__title">Website Redesign</h1>
    <p class="stub__note">The case study is being written. It will live here.</p>
    <p><a class="stub__back" href="../../">Back to work</a></p>
  </main>
</body>
</html>
